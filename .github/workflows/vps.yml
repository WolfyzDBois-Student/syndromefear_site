name: Déploiement FTP vers VPS

on:
  workflow_run:
    workflows: ["deploy", "release"]
    types:
      - completed

jobs:
  deploy-to-vps:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Déployer vers syndromefear.wolfyz.fr
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupérer les sources
        uses: actions/checkout@v4

      - name: 🔧 Installer lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: 🧼 Supprimer l'ancien contenu du dossier distant
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          REMOTE_PATH: /home/u266426828/domains/wolfyz.fr/public_html/syndromefear
        run: |
          lftp -e "
            set ssl:verify-certificate no
            open -u $FTP_USER,$FTP_PASS $FTP_HOST
            cls -1 $REMOTE_PATH | while read file; do rm -r $REMOTE_PATH/$file; done
            bye
          "

      - name: 📤 Uploader le contenu de dist/ vers le VPS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          REMOTE_PATH: /home/u266426828/domains/wolfyz.fr/public_html/syndromefear
        run: |
          lftp -e "
            set ssl:verify-certificate no
            open -u $FTP_USER,$FTP_PASS $FTP_HOST
            mirror --reverse --verbose ./dist $REMOTE_PATH
            bye
          "
