name: Déploiement FTP vers VPS

on:
  push:
    branches:
      - main

jobs:
  deploy-to-vps:
    name: Déployer vers syndromefear.wolfyz.fr
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupérer les sources
        uses: actions/checkout@v4

      - name: ⏳ Attendre 120 secondes
        run: sleep 120

      - name: 🔧 Installer lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: 🧼 Supprimer l'ancien contenu du dossier distant (ou créer le dossier)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          REMOTE_PATH: /home/u266426828/domains/wolfyz.fr/public_html/syndromefear
        run: |
          lftp -e "
            set ssl:verify-certificate no
            open -u $FTP_USER,$FTP_PASS $FTP_HOST
            mkdir -p $REMOTE_PATH
            cd $REMOTE_PATH
            glob -a rm -r *
            bye
          "

      - name: 📤 Uploader le contenu de dist/ vers le VPS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          REMOTE_PATH: /home/u266426828/domains/wolfyz.fr/public_html/syndromefear
        run: |
          lftp -e "
            set ssl:verify-certificate no
            open -u $FTP_USER,$FTP_PASS $FTP_HOST
            mkdir -p $REMOTE_PATH
            mirror --reverse --verbose ./dist $REMOTE_PATH
            bye
          "
